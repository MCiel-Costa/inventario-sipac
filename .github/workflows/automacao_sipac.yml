name: Automação SIPAC para Firebase

on:
  schedule:
    # Executa todos os dias às 06:00 (UTC) que é 03:00 no Brasil (Ajuste conforme necessário)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  run-robot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Instalar Dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Criar arquivo de credencial do Firebase temporário
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase_key.json

    - name: Executar Robô do Inventário
      env:
        SIPAC_USER: ${{ secrets.SIPAC_USER }}
        SIPAC_PASSWORD: ${{ secrets.SIPAC_PASSWORD }}
      run: python robo_inventario.py

    - name: Limpar credencial do Firebase
      if: always()
      run: rm -f firebase_key.json
