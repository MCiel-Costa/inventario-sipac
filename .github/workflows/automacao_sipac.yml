name: Automação SIPAC para Firebase

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-robot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Criar arquivo de credencial
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase_key.json

    - name: Executar Robô do Inventário
      env:
        SIPAC_USER: ${{ secrets.SIPAC_USER }}
        SIPAC_PASSWORD: ${{ secrets.SIPAC_PASSWORD }}
      run: python robo_inventario.py

    - name: Limpar credencial
      if: always()
      run: rm -f firebase_key.json
