name: Automação SIPAC para Firebase
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar Google Chrome
      run: |
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Criar arquivo de credencial do Firebase temporário
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase_key.json

    - name: Executar Robô do Inventário
      env:
        SIPAC_USER: ${{ secrets.SIPAC_USER }}
        SIPAC_PASSWORD: ${{ secrets.SIPAC_PASSWORD }}
      run: python robo_inventario.py

    - name: Upload screenshot de diagnóstico
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-screenshot
        path: debug_screenshot.png
        if-no-files-found: warn

    - name: Limpar credencial do Firebase
      if: always()
      run: rm -f firebase_key.json
